name: 1 - Deploy API Routes

on:
  push:
    branches:
      - main

permissions:
  id-token: write

jobs:
  deploy-api-routes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION1 }}

      - name: Deploy to API Gateway
        run: |
          aws apigatewayv2 reimport-api --api-id ${{ vars.API_GW_ID }} --body file://./swagger.yml --region us-east-2 

  publish-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate API Docs
        run: npx @redocly/cli build-docs swagger.yml -o ./public/api-docs.html

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION1 }}

      - name: Deploy to S3
        run: |
          aws s3 sync ./public s3://${{ vars.S3_BUCKET_NAME }}/docs/apis --delete

  invalidate-cloudfront:
    runs-on: ubuntu-latest
    needs: deploy-s3

    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION1 }}

      - name: "Invalidate CloudFront Cache"
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"